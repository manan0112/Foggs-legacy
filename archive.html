<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive — FOGGS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/files/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="180x180" href="assets/files/favicon-180.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/files/favicon-180.png?v=2">
  <link rel="shortcut icon" href="assets/files/favicon-32.png?v=2">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/archive.css">
  <script src="assets/js/layout.js" defer></script>
</head>
<body>
  <div data-include="header"></div>

  <main class="main">
    <h1 class="page-title">Archive</h1>
    <p class="lede">Chronological record of FOGGS Newsletter and issued documents.</p>

    <section class="section" aria-label="Newsletters">
      <h2>Newsletters</h2>
      <p class="lede">All FOGGS Updates</p>
      <div class="archive-grid" id="newsletter-grid">
        <!-- Cards will be generated from existing list entries by script for graceful fallback -->
      </div>
    </section>

    <section class="section" aria-label="Podcasts">
      <h2>Podcasts</h2>
      <p class="lede">All episodes from the Katoikos World podcast archive.</p>
      <div class="archive-grid" id="podcast-grid"></div>
    </section>

    <section aria-label="Archive by year">
      <div class="section">
        <h2>Documents by year</h2>
        <div class="archive-sections" id="archive-sections" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <script src="assets/js/pages/archive.js" defer></script>
</body>
</html>
